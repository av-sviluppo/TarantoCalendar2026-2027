<style>
:root {
  --bg: #f4f7fb;
  --card: #ffffff;
  --text: #172033;
  --muted: #687386;
  --border: #e3e8f0;
  --primary: #1a73e8;
  --primary-dark: #1558b0;
  --success: #188038;
  --shadow: 0 10px 30px rgba(25, 45, 80, .08);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: linear-gradient(135deg, #b40018 0%, #b40018 48%, #001f5b 52%, #001f5b 100%); background-attachment: fixed;
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
.container { max-width: 980px; margin: 0 auto; padding: 28px 18px 42px; }
.hero {
  background: var(--card); border: 1px solid var(--border); border-radius: 22px;
  padding: 28px; box-shadow: var(--shadow); margin-bottom: 18px;
}
.badge {
  display:inline-flex; align-items:center; gap:7px; padding:6px 10px;
  border-radius:999px; background:#e8f0fe; color:var(--primary);
  font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
}
h1 { margin:12px 0 6px; font-size:clamp(28px,5vw,40px); line-height:1.1; }
.intro { margin:0; color:var(--muted); font-size:16px; }
.toolbar {
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--card); border:1px solid var(--border); border-radius:18px;
  padding:14px; box-shadow:var(--shadow); margin-bottom:16px;
}
button {
  border:0; border-radius:11px; padding:11px 15px; cursor:pointer;
  font-size:14px; font-weight:700; transition:.15s ease; 
}
button:hover { transform:translateY(-1px); }
.primary { background:var(--primary); color:white; }
.primary:hover { background:var(--primary-dark); }
.secondary { background:#eef2f7; color:#354052; }
.counter { margin-left:auto; color:var(--muted); font-size:13px; font-weight:600; }
.eventi { display:grid; gap:10px; }
.evento {
  display:flex; gap:14px; align-items:flex-start; background:var(--card);
  border:1px solid var(--border); border-radius:16px; padding:15px 16px;
  cursor:pointer; box-shadow:0 3px 12px rgba(25,45,80,.04); transition:.15s ease;
}
.evento:hover { border-color:#b9cdf0; box-shadow:var(--shadow); }
.evento:has(input:checked) { border-color:#9fc0f4; background:#fbfdff; }
.evento input {
  flex:0 0 auto; margin:4px 0 0; width:19px; height:19px;
  accent-color:var(--primary); cursor:pointer;
}
.evento strong { display:block; font-size:16px; }
.meta { color:var(--muted); font-size:13px; margin-top:4px; }
.desc { margin-top:7px; font-size:14px; color:#3e4858; }
.date { flex:0 0 auto; min-width:58px; text-align:center; border-radius:12px;
  background:#f1f5fb; padding:7px 5px; }
.date .day { display:block; font-size:20px; font-weight:800; line-height:1; }
.date .month { display:block; margin-top:3px; font-size:10px; font-weight:800; color:var(--primary); text-transform:uppercase; }
#messaggio {
  margin-top:16px; padding:12px 14px; border-radius:12px;
  background:#edf7ee; color:var(--success); font-size:14px; font-weight:600;
}
.nota {
  margin:20px 4px 0; color:var(--muted); font-size:12px; line-height:1.5;
}
@media (max-width:620px) {
  .container { padding:14px 12px 28px; }
  .hero { padding:22px 18px; border-radius:18px; }
  .toolbar { border-radius:15px; }
  .counter { width:100%; margin-left:0; order:5; }
  .toolbar button { flex:1 1 auto; }
  .evento { padding:13px; }
}
table {
  border-collapse: separate;
  border-spacing: 15px; /* Modifica il valore per cambiare lo spazio */
}
</style>
</head>

// CODICE DELL'APPLICAZIONE - NON È NECESSARIO MODIFICARLO

function escapeHtml(t) {
  return String(t ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  }[c]));
}

function dataIt(data) {
  const [y,m,d] = data.split("-");
  return `${d}/${m}/${y}`;
}

function renderEventi() {
  const contenitore = document.getElementById("eventi");

  if (!eventi.length) {
    contenitore.innerHTML = "<p>Nessun evento presente.</p>";
    return;
  }

  contenitore.innerHTML = eventi.map((e, i) => {
    const [, mese, giorno] = e.data.split("-");
    const mesi = ["","gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
    return `
    <label class="evento">
      <input type="checkbox" class="evento-check" data-index="${i}" checked onchange="aggiornaContatore()">
      <span class="date"><span class="day">${giorno}</span><span class="month">${mesi[Number(mese)]}</span></span>
      <div>
        <strong>${escapeHtml(e.titolo)}</strong>
        <div class="meta">
          ${dataIt(e.data)} · ${escapeHtml(e.oraInizio)}–${escapeHtml(e.oraFine)}
          ${e.luogo ? " · " + escapeHtml(e.luogo) : ""}
        </div>
        ${e.descrizione ? `<div class="desc">${escapeHtml(e.descrizione)}</div>` : ""}
      </div>
    </label>`;
  }).join("");
  aggiornaContatore();
}

function selezionaTutti(valore) {
  document.querySelectorAll(".evento-check").forEach(c => c.checked = valore);
  aggiornaContatore();
}

function aggiornaContatore() {
  const totale = document.querySelectorAll(".evento-check").length;
  const selezionati = document.querySelectorAll(".evento-check:checked").length;
  document.getElementById("counter").textContent =
    `${selezionati} di ${totale} eventi selezionati`;
}

function formatoGoogle(data, ora) {
  // Google Calendar URL usa l'ora locale senza fuso:
  // YYYYMMDDTHHMMSS
  return data.replaceAll("-", "") + "T" + ora.replace(":", "") + "00";
}

function creaUrlGoogle(e) {
  const start = formatoGoogle(e.data, e.oraInizio);
  const end = formatoGoogle(e.data, e.oraFine);

  const params = new URLSearchParams({
    action: "TEMPLATE",
    text: e.titolo,
    dates: `${start}/${end}`,
    details: e.descrizione || "",
    location: e.luogo || ""
  });

  return "https://calendar.google.com/calendar/render?" + params.toString();
}

function aggiungiSelezionati() {
  const selezionati = [...document.querySelectorAll(".evento-check:checked")]
    .map(c => Number(c.dataset.index));

  const messaggio = document.getElementById("messaggio");

  if (!selezionati.length) {
    messaggio.textContent = "Seleziona almeno un evento.";
    return;
  }

  messaggio.textContent =
    "Si aprirà una scheda di Google Calendar per ogni evento selezionato. " +
    "Premi «Salva» in Google Calendar per confermare.";

  // Apriamo gli eventi uno alla volta. I browser possono bloccare più
  // finestre contemporaneamente; per questo c'è una piccola pausa.
  selezionati.forEach((indice, posizione) => {
    setTimeout(() => {
      window.open(creaUrlGoogle(eventi[indice]), "_blank");
    }, posizione * 700);
  });
}

renderEventi();
</script>
